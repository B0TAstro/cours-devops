<hr>

<div class="panel panel-default generated-zips">
  <div class="panel-heading">
    <h3 class="panel-title" id="zips-title">Archives déjà générées</h3>
  </div>
  <div class="panel-body">

    <p id="zips-status" class="text-muted">Chargement des archives&hellip;</p>
    <ul id="zips-list" class="list-unstyled"></ul>

  </div>
</div>

<script>
  (function () {
    var title = document.getElementById('zips-title');
    var status = document.getElementById('zips-status');
    var list = document.getElementById('zips-list');

    var current = new URLSearchParams(window.location.search);
    var query = new URLSearchParams();

    if (current.get('tags')) {
      query.set('tags', current.get('tags'));
      title.textContent = 'Archives générées pour « ' + current.get('tags') + ' »';
    }

    fetch('/zips' + (query.toString() ? '?' + query.toString() : ''))
      .then(function (response) {
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        return response.json();
      })
      .then(function (payload) {
        if (!payload.total) {
          status.textContent = 'Aucune archive enregistrée pour cette recherche.';
          return;
        }

        payload.zips.forEach(function (zip) {
          var item = document.createElement('li');
          var label = zip.tags || zip.filename || 'archive';

          if (zip.url) {
            var link = document.createElement('a');
            link.href = zip.url;
            link.textContent = label;
            item.appendChild(link);
          } else {
            var plain = document.createElement('span');
            plain.textContent = label;
            item.appendChild(plain);

            var gone = document.createElement('span');
            gone.className = 'label label-default';
            gone.textContent = 'archive introuvable';
            item.appendChild(document.createTextNode(' '));
            item.appendChild(gone);
          }

          var meta = document.createElement('small');
          meta.className = 'text-muted';
          meta.textContent =
            ' — ' + (zip.createdAt ? new Date(zip.createdAt).toLocaleString() : 'date inconnue');
          item.appendChild(meta);

          list.appendChild(item);
        });

        if (payload.returned < payload.total) {
          status.textContent =
            payload.returned + ' archives affichées sur ' + payload.total + ' enregistrées.';
        } else {
          status.style.display = 'none';
        }
      })
      .catch(function (error) {
        status.className = 'text-danger';
        status.textContent = 'Impossible de charger les archives.';
        console.log('failed to fetch /zips', error);
      });
  })();
</script>
