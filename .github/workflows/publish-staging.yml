name: 🚧 Publish staging image

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  publish-staging-image:
    name: 🐳 Build & push staging
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout the code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push the staging Docker image
        run: |
          docker build . --tag ghcr.io/b0tastro/cours-devops:staging
          docker push ghcr.io/b0tastro/cours-devops:staging
