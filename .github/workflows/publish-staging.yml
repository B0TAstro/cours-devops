name: 🚧 Publish staging image

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  publish-staging-image:
    name: 🐳 Build & push staging
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # the secrets context is not available in a step-level `if`, so the hook is
    # exposed here and the step tests the env context instead
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

    steps:
      - name: 📥 Checkout the code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push the staging Docker image
        run: |
          docker build . --tag ghcr.io/b0tastro/cours-devops:staging
          docker push ghcr.io/b0tastro/cours-devops:staging

      - name: ☁️ Trigger the render staging deploy
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render staging deploy triggered"
