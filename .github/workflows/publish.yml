name: 🚀 Publish production image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-production-image:
    name: 🐳 Build & push production
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout the code
        uses: actions/checkout@v4

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push the production Docker image
        run: |
          docker build . --tag ghcr.io/b0tastro/cours-devops:production
          docker push ghcr.io/b0tastro/cours-devops:production

      - name: ☁️ Trigger the render production deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render production deploy triggered"
